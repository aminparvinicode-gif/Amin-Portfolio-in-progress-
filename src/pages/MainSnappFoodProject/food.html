<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>snappfood</title>
    <link rel="stylesheet" href="food.css" type="text/css">
    <link rel="icon" href="/snappfood/images/Snappfood-Logo-1030x1030.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add_location" />
</head>
<body>
 <section> 
    <header>
        <div dir="rtl" class="header_right">
           <img class='logo' src="/snappfood/images/Snappfood-Logo-1030x1030.png">
        </div>
        <div class="header_left" dir="rtl">
            <ul class="sabt">
                <li>ثبت نام فروشندگان</li>
              </ul>
              <div class="or">
                <p style="line-height: 40px;"><span style="white-space: nowrap;"><b>ورود</b>&nbsp;یا&nbsp;<b>ثبت نام</b></span></p>
              </div>
        </div>
        <div class="header_bottom">
            <img class='pizza' src="/snappfood - Copy/images/pngtree-top-view-of-sliced-full-pizza-png-image_17415654.png" style="width: 45%;height:auto;">
        </div>
        <div class="header_bottom_left">
            <h1 style="font-family: 'reguler';color: rgb(40, 39, 39);">سفارش آنلاین</h1>
           
            <div class="al_li">  
               <ul class="list"> 
                   <li class="li">خواروبار</li>
                   <li class="li">نان</li>
                   <li class="li">میوه</li>
                   <li class="li">پیتزا</li>
                </ul> 
            </div> 
          <div class="search_box"> 
            <div class="loc">
              <i class="fa fa-location-arrow" ></i> 
              <input type="text" placeholder="ابتدا ادرستان را انتخاب کنید"> 
            </div> 
            <i class="fa fa-search search" id="search"></i>
           </div>     
        </div>
    </header>  
  </section>        
  <div class="al-item">
     <div class="pic">
       <img src="/snappfood/images/restaurant-desktop.png" style="width: 5%;height: auto;z-index: 100;">
     </div>
  </div>

</html>
