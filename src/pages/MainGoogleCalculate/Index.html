<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>google calculator</title>
    <link
      rel="icon"
      type="image/png"
      href="/img/photo24245207069-removebg-preview.png"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=calculate"
    />
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/style.css" />
    <link
      rel="stylesheet"
      href="styles/mobile_responsive.css"
      media="(min-width: 400px) and (max-width: 767px)"
    />
  </head>

  <body>
    <header id="header">
      <div id="header_left" dir="ltr">
        <svg
          width="32"
          height="32"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
          id="menu"
        >
          <path
            class="line-top"
            d="M3 6h18"
            style="transition: transform 0.3s; transform-origin: center"
          />
          <path
            class="line-middle"
            d="M3 12h18"
            style="transition: opacity 0.3s"
          />
          <path
            class="line-bottom"
            d="M3 18h18"
            style="transition: transform 0.3s; transform-origin: center"
          />
        </svg>
        <p id="double_click">double click</p>
        <img
          id="header_img"
          src="./img/photo24245207069-removebg-preview.png"
          alt="google_calculator_logo"
        />
        <div id="dark_mode">
          <i id="moon" class="fa fa-moon-o"></i>
        </div>
      </div>

      <div id="header_right">
        <i>
          <svg
            width="20"
            height="20"
            viewBox="0 0 512 512"
            fill="currentColor"
            xmlns="http://www.w3.org/2000/svg"
          >
            <rect x="96" y="32" width="320" height="448" rx="34" />
            <rect x="152" y="112" width="208" height="48" rx="8" fill="white" />
            <rect x="152" y="192" width="48" height="48" rx="8" fill="white" />
            <rect x="232" y="192" width="48" height="48" rx="8" fill="white" />
            <rect x="312" y="192" width="48" height="48" rx="8" fill="white" />
            <rect x="152" y="272" width="48" height="48" rx="8" fill="white" />
            <rect x="232" y="272" width="48" height="48" rx="8" fill="white" />
            <rect x="312" y="272" width="48" height="48" rx="8" fill="white" />
            <rect x="152" y="352" width="208" height="48" rx="8" fill="white" />
          </svg>
        </i>

        <input type="text" placeholder="calculate now!" id="calculate" />

        <i id="back_to_width" onclick="back_to_width()" class="fa fa-close"></i>
      </div>

      <div id="Enter">
        <img src="/img/arrow down to square.svg" width="17%" />
        <p>log in</p>
      </div>
    </header>

    <section id="section">
      <div id="father_of_main_calculator">
        <div id="main_calculator">
          <div id="result">
            <div id="persons_calculate">
              <p id="persons_calculate_p"></p>
              =
            </div>
            0000
          </div>

          <div id="numbers_operators">
            <div id="first_col">
              <div id="pro" class="btn_dark1 btn">Sin</div>
              <div id="pro" class="btn_dark2 btn">Cos</div>
              <div id="pro" class="btn_dark3 btn">Tan</div>
              <div id="pro" class="btn_dark4 btn">Pi</div>
              <div id="pro" class="btn_dark5 btn">e</div>
            </div>

            <div id="second_col">
              <div id="pro1" class="btn_dark6 btn">log</div>
              <div id="pro1" class="btn_dark7 btn">in</div>
              <div id="pro1" class="btn_dark8 btn">
                <svg
                  width="32"
                  height="32"
                  viewBox="0 0 64 64"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M10 34 L20 44 L30 18 H54"
                    fill="none"
                    stroke="black"
                    stroke-width="4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
              <div id="pro1" class="btn_dark9 btn">^</div>
              <div id="pro1" class="btn_dark10 btn">x²</div>
            </div>

            <div id="third_col">
              <div
                id="pro"
                style="border-color: #fbbc05"
                class="btn_dark11 btn"
              >
                (
              </div>
              <div
                id="pro"
                style="border-color: #fbbc05"
                class="btn_dark12 btn"
              >
                )
              </div>
              <div
                id="pro"
                style="border-color: #fbbc05"
                class="btn_dark13 btn"
              >
                1/x
              </div>
              <div
                id="pro"
                style="border-color: #fbbc05"
                class="btn_dark14 btn"
              >
                |x|
              </div>
              <div
                id="pro"
                style="border-color: #fbbc05"
                class="btn_dark15 btn"
              >
                !
              </div>
            </div>

            <div id="forth_col">
              <div id="pro" class="btn_dark16 btn">
                <i class="fa fa-trash"></i>
              </div>
              <div id="pro" class="btn_dark17 btn">7</div>
              <div id="pro" class="btn_dark18 btn">4</div>
              <div id="pro" class="btn_dark19 btn">1</div>
              <div id="pro" class="btn_dark20 btn">0</div>
            </div>

            <div id="fifth_col">
              <div id="green_border" class="btn_dark21 btn">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  class="bi bi-backspace-fill"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M15.683 3a2 2 0 0 0-2-2h-7.08a2 2 0 0 0-1.519.698L.241 7.35a1 1 0 0 0 0 1.302l4.843 5.65A2 2 0 0 0 6.603 15h7.08a2 2 0 0 0 2-2zM5.829 5.854a.5.5 0 1 1 .707-.708l2.147 2.147 2.146-2.147a.5.5 0 1 1 .707.708L9.39 8l2.146 2.146a.5.5 0 0 1-.707.708L8.683 8.707l-2.147 2.147a.5.5 0 0 1-.707-.708L7.976 8z"
                  />
                </svg>
              </div>
              <div id="green_border" class="btn_dark22 btn">8</div>
              <div id="green_border" class="btn_dark23 btn">5</div>
              <div id="green_border" class="btn_dark24 btn">2</div>
              <div id="red_border" class="btn_dark25">.</div>
            </div>

            <div id="sixth_col">
              <div id="red_border" class="btn_dark26 btn">%</div>
              <div id="red_border" class="btn_dark27 btn">9</div>
              <div id="red_border" class="btn_dark28 btn">6</div>
              <div id="red_border" class="btn_dark29 btn">3</div>
              <div id="red_border" class="btn_dark30 btn">÷</div>
            </div>

            <div id="seventh">
              <div id="blue_border_copy" class="btn_dark31 btn">+</div>
              <div id="blue_border_copy" class="btn_dark32 btn">−</div>
              <div id="blue_border_copy" class="btn_dark33 btn">×</div>
              <div id="black_border" onclick="createBox()">=</div>
            </div>
          </div>
        </div>
      </div>

      <nav id="nav">
    

        <div id="history_box">
          <!-- آیکون SVG تاریخچه -->
          <svg
            class="history-icon"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            width="20px"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <!-- دایره اصلی ساعت -->
            <circle cx="12" cy="12" r="9" />
            <!-- عقربه ساعت -->
            <polyline points="12 7 12 12 15 15" />
            <!-- فلش برگشت (تاریخچه) -->
            <path d="M3.05 9A9 9 0 0 1 12 3a9 9 0 0 1 6.36 2.64" />
            <polyline points="16 3 21 3 21 8" />
          </svg>
          <p>History</p>
        </div>
        
        <div id="underline_between_boxes" class="underline_between_boxes"></div>
        <div id="sciece_box">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            fill="currentColor"
            class="bi bi-flask-fill"
            viewBox="0 0 16 16"
          >
            <path
              d="M11.5 0a.5.5 0 0 1 0 1H11v5.358l4.497 7.36c.099.162.16.332.192.503l.013.063.008.083q.006.053.007.107l-.003.09q-.001.047-.005.095-.006.053-.017.106l-.016.079q-.012.049-.028.096l-.028.086a1.5 1.5 0 0 1-.17.322 1.5 1.5 0 0 1-.395.394q-.04.028-.082.054-.045.026-.095.049l-.073.035-.09.033q-.05.02-.103.034-.04.01-.08.017-.053.012-.108.021l-.006.002-.202.013H1.783l-.214-.015a1.503 1.503 0 0 1-1.066-2.268L5 6.359V1h-.5a.499.499 0 0 1-.354-.854A.5.5 0 0 1 4.5 0zm.5 12a.5.5 0 0 0 0 1h1.885l-.61-1zm-1-2a.5.5 0 0 0 0 1h1.664l-.612-1zm-1-2a.5.5 0 0 0 0 1h1.441l-.61-1zM9 6a.5.5 0 0 0 0 1h1.22l-.147-.24A.5.5 0 0 1 10 6.5V6zm0-2a.5.5 0 0 0 0 1h1V4zm0-2a.5.5 0 0 0 0 1h1V2z"
            />
          </svg>
          <p>Scientific Mode</p>
        </div>
            <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          id="back_to_menu"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        <div id="underline_between_boxes" class="underline_between_boxes"></div>
      </nav>
    </section>

    <script src="js/script.js"></script>
  </body>
</html>
