<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
    <!-- ===== دایره‌های پس‌زمینه (پررنگ) ===== -->
    <circle cx="60" cy="60" r="55" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
    <circle cx="60" cy="60" r="45" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="35" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <circle cx="60" cy="60" r="25" fill="none" stroke="rgba(79,70,229,0.3)" stroke-width="1" stroke-dasharray="3 3"/>
    
    <!-- ===== مستطیل‌های چرخیده (خیلی پررنگ) ===== -->
    <g transform="rotate(-15, 60, 60)">
        <!-- ردیف اول - بنفش پررنگ با هایلایت -->
        <rect x="22" y="35" width="76" height="12" rx="6" fill="rgba(79,70,229,0.85)" stroke="rgba(79,70,229,0.4)" stroke-width="1"/>
        <rect x="28" y="37" width="40" height="3" rx="1.5" fill="rgba(255,255,255,0.15)"/>
        
        <!-- ردیف دوم - بنفش-صورتی پررنگ -->
        <rect x="25" y="51" width="66" height="12" rx="6" fill="rgba(124,58,237,0.75)" stroke="rgba(124,58,237,0.35)" stroke-width="1"/>
        <rect x="31" y="53" width="35" height="3" rx="1.5" fill="rgba(255,255,255,0.12)"/>
        
        <!-- ردیف سوم - صورتی پررنگ -->
        <rect x="28" y="67" width="54" height="12" rx="6" fill="rgba(236,72,153,0.65)" stroke="rgba(236,72,153,0.3)" stroke-width="1"/>
        <rect x="34" y="69" width="28" height="3" rx="1.5" fill="rgba(255,255,255,0.1)"/>
        
        <!-- ردیف چهارم - فیروزه‌ای پررنگ -->
        <rect x="33" y="83" width="38" height="10" rx="5" fill="rgba(6,182,212,0.55)" stroke="rgba(6,182,212,0.25)" stroke-width="0.8"/>
        <rect x="39" y="85" width="20" height="2.5" rx="1.25" fill="rgba(255,255,255,0.1)"/>
    </g>
    
    <!-- ===== نقطه‌های تزئینی (بسیار پررنگ) ===== -->
    <circle cx="26" cy="26" r="5" fill="rgba(79,70,229,0.9)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <circle cx="94" cy="26" r="5" fill="rgba(124,58,237,0.9)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <circle cx="26" cy="94" r="5" fill="rgba(236,72,153,0.9)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    <circle cx="94" cy="94" r="5" fill="rgba(6,182,212,0.9)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5"/>
    
    <!-- ===== نقطه‌های کوچک (پررنگ) ===== -->
    <circle cx="45" cy="16" r="3" fill="rgba(79,70,229,0.6)"/>
    <circle cx="75" cy="16" r="3" fill="rgba(124,58,237,0.6)"/>
    <circle cx="16" cy="45" r="3" fill="rgba(236,72,153,0.6)"/>
    <circle cx="104" cy="45" r="3" fill="rgba(6,182,212,0.6)"/>
    <circle cx="45" cy="104" r="3" fill="rgba(79,70,229,0.6)"/>
    <circle cx="75" cy="104" r="3" fill="rgba(124,58,237,0.6)"/>
    <circle cx="16" cy="75" r="3" fill="rgba(236,72,153,0.6)"/>
    <circle cx="104" cy="75" r="3" fill="rgba(6,182,212,0.6)"/>
    
    <!-- ===== چشمک (بسیار پررنگ و درخشان) ===== -->
    <circle cx="60" cy="60" r="18" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
    <circle cx="60" cy="60" r="8" fill="white" opacity="0.9"/>
    <circle cx="60" cy="60" r="4" fill="rgba(79,70,229,0.9)"/>
    
    <!-- ===== هایلایت روی چشمک ===== -->
    <circle cx="56" cy="56" r="2" fill="white" opacity="0.6"/>
</svg>